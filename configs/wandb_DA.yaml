# ════════════════════════════════════════════════════════════════
# Weights & Biases Sweep Configuration
# ════════════════════════════════════════════════════════════════

method: random                           # Sweep search strategy
name: "wandb_DA"                      # Name of the sweep

# ════════════════════════════════════════════════════════════════
# Parameters to sweep over
# ════════════════════════════════════════════════════════════════
parameters:

  aux_config_path:
    values: [
      "aux_wandb_DA_earthy-sweep-28.yaml",
      "aux_wandb_DA_exalted-sweep-55.yaml",
      "aux_wandb_DA_still-sweep-89.yaml",
      "aux_wandb_DA_upbeat-sweep-77.yaml",
      "aux_wandb_DA_vivid-sweep-20.yaml",
    ] 

  # ── Training Config ──
  l2_lambda:
    distribution: log_uniform_values
    min: 0.00000001
    max: 1.0
  
  NN_batches_per_epoch:
    distribution: int_uniform
    min: 2048
    max: 16384

  batch_size:
    distribution: int_uniform
    min: 1024
    max: 15597

  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1

  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.1

  clip_grad_norm:
    distribution: log_uniform_values
    min: 0.00001
    max: 10.0
